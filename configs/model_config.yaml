# configs/model_config.yaml
# =========================
# Model paths & hardware settings

embedding:
  model_name: "BAAI/bge-m3"
  use_fp16: true
  batch_size: 16
  max_length: 1024
  # device: "cuda"  # uncomment để force GPU

llm:
  # Provider: "local" (Qwen/Ollama) hoặc "deepseek" (DeepSeek V4 Pro API).
  # Có thể override qua biến môi trường LLM_PROVIDER hoặc CLI --provider.
  provider: "local"

  # --- Local provider (Qwen via Ollama/vLLM) ---
  model_name: "qwen2.5:14b"
  base_url: "http://localhost:11434/v1"
  api_key: "not-needed"
  temperature_acu: 0.05       # Tầng 1 — cực thấp, anti-hallucination
  temperature_summary: 0.3    # Tầng 4 — cho phép diễn đạt tự nhiên hơn
  max_tokens_acu: 8192        # S3: tách ACU mịn hơn → JSON dài hơn; 8192 tránh cắt ngắn
  max_tokens_summary: 1024
  timeout_seconds: 300.0
  max_retries: 3

# Cấu hình cho từng provider (merged vào llm config khi provider được chọn).
# Section này KHÔNG bị override bởi pipeline_config.yaml.
provider_presets:
  deepseek:
    model_name: "deepseek-chat"               # override qua env DEEPSEEK_MODEL
    base_url: "https://api.deepseek.com/v1"   # override qua env DEEPSEEK_BASE_URL
    api_key: ""                                # LUÔN load từ env DEEPSEEK_API_KEY
    # DeepSeek V4 Pro có khả năng reasoning mạnh — dùng temperature thấp hơn
    # cho structured JSON output vì model đã đủ deterministic ở low temp.
    temperature_acu: 0.0        # Zero-temperature cho ACU extraction (JSON mode)
    temperature_summary: 0.2    # Thấp hơn Qwen — DeepSeek diễn đạt tự nhiên hơn ở low temp
    max_tokens_acu: 8192        # DeepSeek hỗ trợ output dài
    max_tokens_summary: 1024
    timeout_seconds: 180.0      # API call có thể chậm hơn local
    max_retries: 3

ingestion:
  confidence_threshold: 0.75  # Ngưỡng OCR fallback (Docling → Marker)
  embedding_dim: 1024          # BGE-M3 dense output dimension
